<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelVerse - Platform Publikasi Novel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f5f7;--card:#ffffff;--text:#171717;--muted:#777;--primary:#6c5ce7;--primary2:#5848d6;--border:#e5e5e5;--danger:#e74c3c;}
body.dark{--bg:#111116;--card:#1b1b22;--text:#f5f5f5;--muted:#aaa;--border:#30303a;}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s;}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold;}
.primary{background:var(--primary);color:white;}
.primary:hover{background:var(--primary2);}
.danger{background:var(--danger);color:white;}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
nav{height:65px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:100;}
.logo{color:var(--primary);font-size:23px;font-weight:bold;cursor:pointer;}
.nav-buttons{display:flex;gap:5px;align-items:center;}
.nav-btn{background:transparent;color:var(--text);}
.nav-btn:hover{background:var(--bg);}
main{width:88%;max-width:1200px;margin:auto;padding:30px 0;}
.page{display:none;}
.page.active{display:block;}
.hero{background:linear-gradient(135deg,var(--primary),#9b59b6);color:white;border-radius:18px;padding:45px 30px;margin-bottom:25px;}
.hero h1{font-size:36px;margin-bottom:10px;}
.hero p{opacity:.9;}
.search-area{display:flex;gap:10px;margin-bottom:25px;}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--primary);}
.search-area select{max-width:190px;}
.novel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;}
.novel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s;display:flex;flex-direction:column;}
.novel-card:hover{transform:translateY(-3px);}
.cover{width:100%;height:280px;object-fit:cover;background:#ddd;}
.novel-info{padding:15px;display:flex;flex-direction:column;flex-grow:1;}
.novel-info h3{margin-bottom:6px;font-size:18px;}
.genre{color:var(--primary);font-size:13px;margin-bottom:7px;font-weight:bold;}
.author{color:var(--muted);font-size:13px;}
.description{color:var(--muted);font-size:14px;line-height:1.5;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-buttons{display:flex;gap:6px;margin-top:auto;padding-top:15px;}
.card-buttons button{flex:1;font-size:12px;}
.form-container{max-width:700px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:25px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-weight:bold;margin-bottom:7px;}
textarea{min-height:350px;resize:vertical;}
.counter{color:var(--muted);font-size:13px;margin-top:5px;}
.counter.valid{color:#2ecc71;}
.form-actions{display:flex;gap:8px;}
.reader{max-width:800px;margin:auto;background:var(--card);border-radius:15px;padding:30px;}
.reader-cover{width:180px;height:250px;display:block;margin:20px auto;object-fit:cover;border-radius:8px;}
.reader h1{text-align:center;}
.reader-meta{text-align:center;color:var(--muted);margin:8px 0 30px;}
.reader-content{white-space:pre-wrap;line-height:1.9;font-size:17px;}
.auth-box{max-width:450px;margin:30px auto;background:var(--card);border:1px solid var(--border);padding:25px;border-radius:14px;}
.auth-box h2{margin-bottom:20px;}
.auth-switch{margin-top:15px;color:var(--muted);text-align:center;}
.auth-switch button{background:none;color:var(--primary);padding:0;}
.profile{max-width:900px;margin:auto;}
.profile-header{text-align:center;background:var(--card);border:1px solid var(--border);padding:30px;border-radius:15px;margin-bottom:25px;}
.avatar{width:90px;height:90px;margin:auto auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--primary);color:white;font-size:35px;font-weight:bold;}
.profile-header p{color:var(--muted);margin:8px 0 15px;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:#222;color:white;padding:13px 20px;border-radius:8px;transition:.3s;z-index:999;}
.toast.show{transform:translateX(-50%) translateY(0);}
@media(max-width:650px){nav{padding:0 3%;}.logo{font-size:18px;}.nav-btn{padding:8px;font-size:11px;}main{width:92%;padding-top:20px;}.hero{padding:30px 20px;}.hero h1{font-size:27px;}.search-area{flex-direction:column;}.search-area select{max-width:none;}.novel-grid{grid-template-columns:repeat(2,1fr);gap:12px;}.cover{height:220px;}.novel-info{padding:10px;}.novel-info h3{font-size:15px;}.reader{padding:20px;}.reader-content{font-size:16px;}.form-actions{flex-direction:column;}}
</style>
</head>
<body>
<nav>
    <div class="logo" onclick="showPage('home')">NovelVerse</div>
    <div class="nav-buttons">
        <button class="nav-btn" onclick="showPage('home')">Home</button>
        <button class="nav-btn" onclick="showPage('publish')">Publish</button>
        <button class="nav-btn" onclick="showPage('profile')">Profil</button>
        <button id="accountNavBtn" class="nav-btn" onclick="showPage('auth')">Akun</button>
        <button class="nav-btn" onclick="toggleDark()">◐</button>
    </div>
</nav>
<main>
    <section id="home" class="page active">
        <div class="hero"><h1>Temukan Ceritamu.</h1><p>Baca dan publikasikan novelmu sendiri secara bebas.</p></div>
        <div class="search-area">
            <input id="search" type="text" placeholder="Cari judul novel..." oninput="loadNovels()">
            <select id="genreFilter" onchange="loadNovels()">
                <option value="all">Semua Genre</option><option>Action</option><option>Adventure</option><option>Comedy</option><option>Drama</option><option>Fantasy</option><option>Horror</option><option>Mystery</option><option>Romance</option><option>Sci-Fi</option><option>Thriller</option><option>Other</option>
            </select>
        </div>
        <div id="novelGrid" class="novel-grid"></div>
    </section>
        <section id="auth" class="page">
        <div class="auth-box">
            <h2 id="authTitle">Login</h2>
            <div class="form-group"><label>Email</label><input id="authEmail" type="email" placeholder="email@example.com"></div>
            <div class="form-group"><label>Password</label><input id="authPassword" type="password" placeholder="Minimal 6 karakter"></div>
            <div id="usernameGroup" class="form-group" style="display:none"><label>Username</label><input id="authUsername" type="text" placeholder="Nama pena kamu"></div>
            <button id="authButton" class="primary" style="width:100%" onclick="handleAuth()">Login</button>
            <div class="auth-switch"><span id="authSwitchText">Belum punya akun?</span> <button onclick="switchAuth()">Daftar</button></div>
        </div>
    </section>
    <section id="publish" class="page">
        <div class="form-container">
            <h2 id="publishTitle">Publish Novel Baru</h2><br>
            <div id="loginRequired" style="display:none; text-align:center;"><p>Kamu harus login terlebih dahulu.</p><br><button class="primary" onclick="showPage('auth')">Login / Daftar</button></div>
            <form id="novelForm" onsubmit="handlePublish(event)" style="display:none">
                <input id="editId" type="hidden">
                <div class="form-group"><label>Judul Novel</label><input id="title" type="text" required placeholder="Masukkan judul unik"></div>
                <div class="form-group"><label>Genre</label><select id="genre" required><option value="">Pilih genre</option><option>Action</option><option>Adventure</option><option>Comedy</option><option>Drama</option><option>Fantasy</option><option>Horror</option><option>Mystery</option><option>Romance</option><option>Sci-Fi</option><option>Thriller</option><option>Other</option></select></div>
                <div class="form-group"><label>Cover URL (Opsional)</label><input id="cover" type="url" placeholder="https://images.unsplash.com/photo-1543002588-bfa74002ed7e"></div>
                <div class="form-group"><label>Isi Novel</label><textarea id="content" required placeholder="Tulis novelmu di sini (minimal 500 karakter)..." oninput="updateCounter()"></textarea><div id="counterBox" class="counter"><span id="counter">0</span> / 500 karakter minimum</div></div>
                <div class="form-actions"><button type="submit" class="primary">Publish</button><button type="button" class="secondary" onclick="resetNovelForm();showPage('home')">Batal</button></div>
            </form>
        </div>
    </section>
    <section id="reader" class="page">
        <div class="reader"><button class="secondary" onclick="showPage('home')">← Kembali</button><img id="readerCover" class="reader-cover" alt="Cover"><h1 id="readerTitle"></h1><div id="readerMeta" class="reader-meta"></div><hr><br><div id="readerContent" class="reader-content"></div></div>
    </section>
    <section id="profile" class="page">
        <div class="profile"><div class="profile-header"><div id="avatar" class="avatar">?</div><h2 id="profileName">Belum login</h2><p id="profileBio">Login untuk melihat profil.</p><button id="logoutButton" class="danger" style="display:none;" onclick="logout()">Logout</button></div><h2>Novel Saya</h2><br><div id="profileNovels" class="novel-grid"></div></div>
    </section>
</main>
<div id="toast" class="toast"></div>
<script>
const DEFAULT_NOVELS = [
    { id: "ai-1", title: "Ksatria Kuno & Gerbang Langit", genre: "Fantasy", author: "AI Writer", authorId: "ai-author", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500", date: "2026-01-10", content: `Di ujung benua Arkania, berdiri sebuah menara tua tempat gerbang langit bersemayam. Legenda mengatakan bahwa siapapun yang berhasil membuka gerbang tersebut akan mendapatkan kekuatan yang melebihi para dewa. Namun, selama seribu tahun, tidak ada satu jiwa pun yang sanggup melangkah melewatinya.\n\nSeorang pemuda bernama Elian, pendekar pedang dari desa terpencil, membawa belati kuno warisan ayahnya. Ia tidak mengincar tahta atau kekuatan ajaib, ia hanya ingin mencari kebenaran di balik hilangnya sang ayah lima belas tahun lalu.\n\nPerjalanan Elian dipenuhi rintangan sengit, mulai dari menghadapi monster bayangan hingga pengkhianatan dari teman perjalanannya sendiri. Saat sampai di depan pintu gerbang langit yang megah dan dipenuhi ukiran rumit, belati kuno di pinggangnya mendadak bersinar terang. Gelombang energi magis merekah, membuka celah rahasia yang telah lama terkunci dari peradaban manusia.` },
    { id: "ai-2", title: "Sinyal dari Nebula Omega", genre: "Sci-Fi", author: "AI Writer", authorId: "ai-author", cover: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500", date: "2026-02-01", content: `Pada tahun 2154, stasiun luar angkasa Horizon-9 menangkap sinyal radio misterius berbentuk deret frekuensi teratur dari Nebula Omega. Sinyal itu bukan transmisi kosmik biasa, melainkan cetak biru teknologi mutakhir yang melompati zaman manusia.\n\nDr. Aris, seorang astrofisikawan senior, memimpin misi pengodean data tersebut. Ketika modul dekoder berhasil menerjemahkan seluruh baris sinyal, seluruh instrumen stasiun tiba-tiba mati total. Di tengah kegelapan hampa udara, muncul proyeksi hologram interaktif.\n\nEntitas digital itu memberikan sebuah peringatan mengejutkan bagi umat manusia: 'Kami telah mengirimkan koordinat ini ke peradaban lain di galaksi. Waktu kalian untuk bersiap tinggal seratus hari.' Keheningan mencekam menyelimuti ruang kendali stasiun Horizon-9 saat mereka menyadari implikasi dari pesan tersebut.` }
];
let currentUser = JSON.parse(localStorage.getItem("nv_user")) || null;
let novels = JSON.parse(localStorage.getItem("nv_novels")) || DEFAULT_NOVELS;
let authMode = "login";
document.addEventListener("DOMContentLoaded", () => { if (localStorage.getItem("nv_dark") === "true") document.body.classList.add("dark"); saveNovels(); updateUserUI(); loadNovels(); });
function saveNovels() { localStorage.setItem("nv_novels", JSON.stringify(novels)); }
function toggleDark() { document.body.classList.toggle("dark"); localStorage.setItem("nv_dark", document.body.classList.contains("dark")); }
function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3000); }
function showPage(pageId) { document.querySelectorAll(".page").forEach(p => p.classList.remove("active")); document.getElementById(pageId).classList.add("active"); if (pageId === "publish") updatePublishPage(); if (pageId === "profile") loadProfile(); window.scrollTo(0, 0); }
function switchAuth() { authMode = authMode === "login" ? "register" : "login"; document.getElementById("authTitle").textContent = authMode === "login" ? "Login" : "Daftar"; document.getElementById("authButton").textContent = authMode === "login" ? "Login" : "Daftar"; document.getElementById("usernameGroup").style.display = authMode === "login" ? "none" : "block"; document.getElementById("authSwitchText").textContent = authMode === "login" ? "Belum punya akun?" : "Sudah punya akun?"; }
function handleAuth() { const email = document.getElementById("authEmail").value.trim(), pass = document.getElementById("authPassword").value, username = document.getElementById("authUsername").value.trim(); if (!email || !pass) return showToast("Email & password wajib diisi."); if (pass.length < 6) return showToast("Password minimal 6 karakter."); if (authMode === "register") { if (!username) return showToast("Username wajib diisi."); currentUser = { id: "user_" + Date.now(), name: username, email: email }; showToast("Pendaftaran berhasil!"); } else { currentUser = { id: "user_" + Date.now(), name: email.split("@")[0], email: email }; showToast("Berhasil login!"); } localStorage.setItem("nv_user", JSON.stringify(currentUser)); updateUserUI(); showPage("home"); }
function logout() { currentUser = null; localStorage.removeItem("nv_user"); updateUserUI(); showToast("Berhasil logout."); showPage("home"); }
function updateUserUI() { document.getElementById("accountNavBtn").textContent = currentUser ? currentUser.name : "Akun"; }
function updatePublishPage() { const form = document.getElementById("novelForm"), req = document.getElementById("loginRequired"); if (!currentUser) { form.style.display = "none"; req.style.display = "block"; } else { form.style.display = "block"; req.style.display = "none"; } }
function updateCounter() { const len = document.getElementById("content").value.length, box = document.getElementById("counterBox"); document.getElementById("counter").textContent = len; if (len >= 500) box.classList.add("valid"); else box.classList.remove("valid"); }
function resetNovelForm() { document.getElementById("editId").value = ""; document.getElementById("title").value = ""; document.getElementById("genre").value = ""; document.getElementById("cover").value = ""; document.getElementById("content").value = ""; document.getElementById("publishTitle").textContent = "Publish Novel Baru"; updateCounter(); }
function handlePublish(e) { e.preventDefault(); if (!currentUser) return showToast("Silakan login dulu!"); const editId = document.getElementById("editId").value, title = document.getElementById("title").value.trim(), genre = document.getElementById("genre").value, cover = document.getElementById("cover").value.trim() || "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500", content = document.getElementById("content").value.trim(); if (content.length < 500) return showToast("Isi novel minimal 500 karakter!"); const duplicate = novels.find(n => n.title.toLowerCase() === title.toLowerCase() && n.id !== editId); if (duplicate) return showToast("Judul novel sudah ada!"); if (editId) { const idx = novels.findIndex(n => n.id === editId); if (idx !== -1) { novels[idx] = { ...novels[idx], title, genre, cover, content }; showToast("Novel diperbarui!"); } } else { novels.unshift({ id: "novel_" + Date.now(), title, genre, cover, content, author: currentUser.name, authorId: currentUser.id, date: new Date().toISOString().split("T")[0] }); showToast("Novel dipublish!"); } saveNovels(); resetNovelForm(); loadNovels(); showPage("home"); }
function editNovel(id) { const item = novels.find(n => n.id === id); if (!item) return; document.getElementById("editId").value = item.id; document.getElementById("title").value = item.title; document.getElementById("genre").value = item.genre; document.getElementById("cover").value = item.cover; document.getElementById("content").value = item.content; document.getElementById("publishTitle").textContent = "Edit Novel"; updateCounter(); showPage("publish"); }
function deleteNovel(id) { if (confirm("Hapus novel ini?")) { novels = novels.filter(n => n.id !== id); saveNovels(); loadNovels(); loadProfile(); showToast("Novel dihapus."); } }
function loadNovels() { const grid = document.getElementById("novelGrid"), search = document.getElementById("search").value.toLowerCase(), genre = document.getElementById("genreFilter").value; const filtered = novels.filter(n => (genre === "all" || n.genre === genre) && n.title.toLowerCase().includes(search)); if (filtered.length === 0) { grid.innerHTML = `<div class="empty">Tidak ada novel.</div>`; return; } grid.innerHTML = filtered.map(n => renderNovelCard(n)).join(""); }
function renderNovelCard(n) { const isOwner = currentUser && currentUser.id === n.authorId; return `<div class="novel-card"><img class="cover" src="${n.cover}" alt="${n.title}" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500'"><div class="novel-info"><div class="genre">${n.genre}</div><h3>${n.title}</h3><div class="author">Oleh: ${n.author}</div><div class="description">${n.content.substring(0, 100)}...</div><div class="card-buttons"><button class="primary" onclick="readNovel('${n.id}')">Baca</button>${isOwner ? `<button class="secondary" onclick="editNovel('${n.id}')">Edit</button><button class="danger" onclick="deleteNovel('${n.id}')">Hapus</button>` : ""}</div></div></div>`; }
function readNovel(id) { const n = novels.find(x => x.id === id); if (!n) return; document.getElementById("readerCover").src = n.cover; document.getElementById("readerTitle").textContent = n.title; document.getElementById("readerMeta").innerHTML = `Genre: <b>${n.genre}</b> | Penulis: <b>${n.author}</b> | Tanggal: ${n.date}`; document.getElementById("readerContent").textContent = n.content; showPage("reader"); }
function loadProfile() { const nameEl = document.getElementById("profileName"), bioEl = document.getElementById("profileBio"), avatarEl = document.getElementById("avatar"), logoutBtn = document.getElementById("logoutButton"), pGrid = document.getElementById("profileNovels"); if (!currentUser) { nameEl.textContent = "Belum Login"; bioEl.textContent = "Silakan login dulu."; avatarEl.textContent = "?"; logoutBtn.style.display = "none"; pGrid.innerHTML = `<div class="empty">Login dulu.</div>`; return; } nameEl.textContent = currentUser.name; bioEl.textContent = `Email: ${currentUser.email}`; avatarEl.textContent = currentUser.name.charAt(0).toUpperCase(); logoutBtn.style.display = "inline-block"; const myNovels = novels.filter(n => n.authorId === currentUser.id); pGrid.innerHTML = myNovels.length === 0 ? `<div class="empty">Belum ada novel.</div>` : myNovels.map(n => renderNovelCard(n)).join(""); }
</script>
</body>
</html>
