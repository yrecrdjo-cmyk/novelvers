<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelVerse - Online Edition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f5f7;--card:#ffffff;--text:#171717;--muted:#777;--primary:#6c5ce7;--border:#e5e5e5;--danger:#e74c3c;}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold;}
.primary{background:var(--primary);color:white;}
.danger{background:var(--danger);color:white;}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
nav{height:65px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:100;}
.logo{color:var(--primary);font-size:23px;font-weight:bold;cursor:pointer;}
.nav-buttons{display:flex;gap:5px;}
main{width:90%;max-width:1100px;margin:auto;padding:25px 0;}
.page{display:none;}
.page.active{display:block;}
.search-area{display:flex;gap:10px;margin-bottom:25px;}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);outline:none;}
.novel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}
.novel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.cover{width:100%;height:250px;object-fit:cover;background:#eee;}
.novel-info{padding:15px;display:flex;flex-direction:column;flex-grow:1;}
.form-container,.auth-box,.reader{max-width:650px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:25px;}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:#222;color:white;padding:12px 20px;border-radius:8px;transition:.3s;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<nav>
    <div class="logo" onclick="showPage('home')">NovelVerse</div>
    <div class="nav-buttons">
        <button class="secondary" onclick="showPage('home')">Home</button>
        <button class="secondary" onclick="showPage('publish')">Publish</button>
        <button id="authBtn" class="primary" onclick="showPage('auth')">Login</button>
    </div>
</nav>

<main>
    <section id="home" class="page active">
        <div class="search-area">
            <input id="search" type="text" placeholder="Cari novel..." oninput="fetchNovels()">
        </div>
        <div id="novelGrid" class="novel-grid"></div>
    </section>

    <section id="auth" class="page">
        <div class="auth-box">
            <h2 id="authTitle">Login Akun</h2><br>
            <input id="email" type="email" placeholder="Email"><br><br>
            <input id="password" type="password" placeholder="Password"><br><br>
            <button class="primary" style="width:100%" onclick="handleAuth()">Submit</button><br><br>
            <button class="secondary" style="width:100%" onclick="toggleAuthMode()">Ubah ke Daftar/Login</button>
            <button id="logoutBtn" class="danger" style="width:100%; display:none; margin-top:10px;" onclick="logout()">Logout</button>
        </div>
    </section>

    <section id="publish" class="page">
        <div class="form-container">
            <h2>Publish Novel (Online)</h2><br>
            <form onsubmit="handlePublish(event)">
                <input id="title" type="text" placeholder="Judul" required><br><br>
                <select id="genre" required>
                    <option value="">Pilih Genre</option>
                    <option>Fantasy</option><option>Sci-Fi</option><option>Romance</option><option>Action</option>
                </select><br><br>
                <input id="cover" type="url" placeholder="URL Gambar Sampul"><br><br>
                <textarea id="content" placeholder="Isi Cerita Novel..." rows="10" required></textarea><br><br>
                <button type="submit" class="primary">Upload ke Server</button>
            </form>
        </div>
    </section>

    <section id="reader" class="page">
        <div class="reader">
            <button class="secondary" onclick="showPage('home')">← Kembali</button><br><br>
            <h1 id="rTitle"></h1><br>
            <p id="rMeta" style="color:var(--muted)"></p><br><hr><br>
            <div id="rContent" style="white-space:pre-wrap; line-height:1.8;"></div>
        </div>
    </section>
</main>

<div id="toast" class="toast"></div>

<script>
// --- SUPABASE CREDENTIALS ---
const SUPABASE_URL = "https://fvuflidwzmocstbbdlno.supabase.co";
const SUPABASE_KEY = "sb_publishable_42a75XiJ9WErGbNz6ZgpzQ_dGX8bvQJ";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isRegister = false;

document.addEventListener("DOMContentLoaded", () => {
    checkUser();
    fetchNovels();
});

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
}

function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

async function checkUser() {
    const { data: { user } } = await db.auth.getUser();
    const btn = document.getElementById("authBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    if (user) {
        btn.textContent = user.email.split("@")[0];
        logoutBtn.style.display = "block";
    } else {
        btn.textContent = "Login";
        logoutBtn.style.display = "none";
    }
}

function toggleAuthMode() {
    isRegister = !isRegister;
    document.getElementById("authTitle").textContent = isRegister ? "Daftar Akun Baru" : "Login Akun";
}

async function handleAuth() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (isRegister) {
        const { error } = await db.auth.signUp({ email, password });
        if (error) return showToast(error.message);
        showToast("Pendaftaran berhasil! Silakan login.");
    } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) return showToast(error.message);
        showToast("Login berhasil!");
        checkUser();
        showPage("home");
    }
}

async function logout() {
    await db.auth.signOut();
    checkUser();
    showToast("Berhasil Keluar");
    showPage("home");
}

async function handlePublish(e) {
    e.preventDefault();
    const { data: { user } } = await db.auth.getUser();
    
    if (!user) return showToast("Wajib login untuk publish!");

    const title = document.getElementById("title").value;
    const genre = document.getElementById("genre").value;
    const cover = document.getElementById("cover").value || "https://images.unsplash.com/photo-1543002588-bfa74002ed7e";
    const content = document.getElementById("content").value;

    const { error } = await db.from('novels').insert([
        { title, genre, cover, content, author: user.email.split("@")[0], author_id: user.id }
    ]);

    if (error) return showToast("Gagal publish: " + error.message);

    showToast("Novel Berhasil Terbit Online!");
    fetchNovels();
    showPage("home");
}

async function fetchNovels() {
    const search = document.getElementById("search").value.toLowerCase();
    const { data, error } = await db.from('novels').select('*').order('created_at', { ascending: false });

    if (error) return;

    const grid = document.getElementById("novelGrid");
    const filtered = (data || []).filter(n => n.title.toLowerCase().includes(search));

    if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">Belum ada novel online.</p>';
        return;
    }

    grid.innerHTML = filtered.map(n => `
        <div class="novel-card">
            <img class="cover" src="${n.cover}">
            <div class="novel-info">
                <h3>${n.title}</h3>
                <small>${n.genre} | Oleh: ${n.author}</small><br>
                <button class="primary" onclick="readNovel('${n.id}')">Baca</button>
            </div>
        </div>
    `).join('');
}

async function readNovel(id) {
    const { data } = await db.from('novels').select('*').eq('id', id).single();
    if (!data) return;

    document.getElementById("rTitle").textContent = data.title;
    document.getElementById("rMeta").textContent = `Genre: ${data.genre} | Penulis: ${data.author}`;
    document.getElementById("rContent").textContent = data.content;
    showPage("reader");
}
</script>
</body>
</html>
